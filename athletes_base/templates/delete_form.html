{% extends 'base.html' %}

{% block content %}
<h2>Удалить запись?</h2>

<p>Спортсмен: <b>{{ athlete }}</b>, дата рождения: {{ athlete.birth_date|date:"d.m.Y" }}</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'index' %}">Отмена</a>
</form>
{% endblock %}
