{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>База данных спортсменов</title>
    <link rel="stylesheet" href="{% static 'athletes_base/style.css' %}">
</head>
<body>
    <div class="container">
        <nav>
            <a href="{% url 'index' %}">Главная (Список)</a>
            <a href="{% url 'add_form' %}">Добавить атлета</a>
            <a href="{% url 'upload_file' %}">Загрузить JSON</a>
        </nav>
        
        {% if messages %}
            <ul class="messages" style="list-style: none; padding: 0;">
                {% for message in messages %}
                    <li {% if message.tags == 'error' %}style="color: red; font-weight: bold;"{% else %}style="color: green;"{% endif %}>
                        {{ message }}
                    </li>
                {% endfor %}
            </ul>
        {% endif %}

        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
